[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "libargs"
version         = "1.0.1"
description     = "Python bindings for libargs — Unix/GNU-style argument parsing"
license         = "MIT"
requires-python = ">=3.8"
readme          = "README.md"
keywords        = ["argparse", "cli", "arguments", "unix", "gnu"]
classifiers     = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage      = "https://github.com/quantung-libraries/libargs"
Repository    = "https://github.com/quantung-libraries/libargs"
"Bug Tracker" = "https://github.com/quantung-libraries/libargs/issues"
Changelog     = "https://github.com/quantung-libraries/libargs/releases"
