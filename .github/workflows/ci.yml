name: CI

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-glibc:
    name: Test · glibc (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make cargo python3-dev python3-pip python3-venv
      - name: Run full test suite
        run: echo "n" | bash build.sh all
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-glibc
          path: |
            build/libargs.a
            build/libargs.so.1.0.0
            build/test_c
            build/libargs-demo
            build/test_python.log
          retention-days: 7

  test-musl:
    name: Test · musl (Alpine)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bash and deps
        shell: sh
        run: apk add --no-cache bash gcc musl-dev make cargo python3-dev py3-pip
      - name: Run full test suite
        shell: bash
        run: echo "n" | bash build.sh all
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-musl
          path: |
            build/libargs.a
            build/libargs.so.1.0.0
            build/test_c
            build/libargs-demo
            build/test_python.log
          retention-days: 7

  publish-pypi:
    name: Publish · PyPI
    needs: [test-glibc, test-musl]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/libargs/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make python3-dev python3-pip
      - name: Build sdist
        run: |
          cd bindings/python
          pip install --upgrade build
          python3 -m build --sdist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist/

  publish-crates:
    name: Publish · crates.io
    needs: [test-glibc, test-musl]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make cargo
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd bindings/rust
          cargo publish --no-verify

  release:
    name: GitHub Release
    needs: [test-glibc, test-musl]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download glibc artefacts
        uses: actions/download-artifact@v4
        with:
          name: build-glibc
          path: dist/glibc/
      - name: Download musl artefacts
        uses: actions/download-artifact@v4
        with:
          name: build-musl
          path: dist/musl/
      - name: Create release archives
        run: |
          cd dist
          tar czf libargs-${{ github.ref_name }}-linux-glibc-x86_64.tar.gz glibc/
          tar czf libargs-${{ github.ref_name }}-linux-musl-x86_64.tar.gz  musl/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: libargs ${{ github.ref_name }}
          body: "Test results: C 67/67, Rust 22/22, Python 35/35"
          files: |
            dist/libargs-${{ github.ref_name }}-linux-glibc-x86_64.tar.gz
            dist/libargs-${{ github.ref_name }}-linux-musl-x86_64.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
