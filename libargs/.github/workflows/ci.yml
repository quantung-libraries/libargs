name: CI

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*"]
    # Skip branch push when a tag is also pushed (avoids double runs)
  pull_request:
    branches: ["main", "master"]

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tests (all platforms in parallel) ──────────────────────────────────────
  test-glibc:
    name: Test · glibc (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make cargo python3-dev python3-pip python3-venv
      - name: Run full test suite
        run: echo "n" | bash build.sh all
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-glibc
          path: |
            build/libargs.a
            build/libargs.so.1.0.0
            build/test_c
            build/libargs-demo
            build/test_python.log
          retention-days: 7

  test-musl:
    name: Test · musl (Alpine)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bash and deps
        shell: sh
        run: apk add --no-cache bash gcc musl-dev make cargo python3-dev py3-pip
      - name: Run full test suite
        shell: bash
        run: echo "n" | bash build.sh all
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-musl
          path: |
            build/libargs.a
            build/libargs.so.1.0.0
            build/test_c
            build/libargs-demo
            build/test_python.log
          retention-days: 7

  test-macos:
    name: Test · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install rust
      - name: Run full test suite
        run: echo "n" | bash build.sh all
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            build/libargs.a
            build/libargs.dylib
            build/test_c
            build/libargs-demo
            build/test_python.log
          retention-days: 7

  # ── Publish + Release (only on version tag, only after ALL tests pass) ──────
  publish:
    name: Publish + Release
    needs: [test-glibc, test-musl, test-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/libargs/
    permissions:
      id-token: write   # PyPI OIDC
      contents: write   # GitHub Release

    steps:
      - uses: actions/checkout@v4

      # ── Download all artefacts ────────────────────────────────────────────
      - name: Download glibc artefacts
        uses: actions/download-artifact@v4
        with:
          name: build-glibc
          path: dist/glibc/
      - name: Download musl artefacts
        uses: actions/download-artifact@v4
        with:
          name: build-musl
          path: dist/musl/
      - name: Download macOS artefacts
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: dist/macos/

      # ── PyPI ─────────────────────────────────────────────────────────────
      - name: Install Python build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make python3-dev python3-pip
      - name: Build sdist
        run: |
          cd bindings/python
          pip install --upgrade build
          python3 -m build --sdist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist/

      # ── crates.io ────────────────────────────────────────────────────────
      - name: Install Rust
        run: |
          sudo apt-get install -y cargo
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd bindings/rust
          cargo publish --no-verify --allow-dirty

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create release archives
        run: |
          cd dist
          tar czf libargs-${{ github.ref_name }}-linux-glibc-x86_64.tar.gz glibc/
          tar czf libargs-${{ github.ref_name }}-linux-musl-x86_64.tar.gz  musl/
          tar czf libargs-${{ github.ref_name }}-macos.tar.gz               macos/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: libargs ${{ github.ref_name }}
          body: |
            ## libargs ${{ github.ref_name }}

            ### Install
            ```
            pip install libargs
            cargo add libargs-rs
            ```

            ### Test results
            C 67/67 · Rust 22/22 · Python 35/35
            Platforms: Linux glibc · Linux musl · macOS
          files: |
            dist/libargs-${{ github.ref_name }}-linux-glibc-x86_64.tar.gz
            dist/libargs-${{ github.ref_name }}-linux-musl-x86_64.tar.gz
            dist/libargs-${{ github.ref_name }}-macos.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
